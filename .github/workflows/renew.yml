name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          电子邮箱: ${{ 秘密.EMAIL }}
          GH_TOKEN: ${{ 秘密.GH_TOKEN }}
          DISCORD_TOKEN: ${{ 秘密.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ 秘密.SESSION_TOKEN }}
          GITHUB_COOKIE: ${{ 秘密.GITHUB_COOKIE }}
          TG_BOT_TOKEN: ${{ 秘密.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ 秘密.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        如果: 总是（）
        run: |
          pkill -f 歌唱盒 ||真实
          pkill -f chromedriver ||真实
          pkill -f 铬 ||真实
          pkill -f Xvfb ||真实
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        如果: 总是（）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          运行=$(gh 运行列表 --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          计数=0
          对于 $runs 中的 run_id；做
            计数=$((计数+1))
            如果 [ $count -gt 1 ];然后
              echo "删除运行记录: $run_id"
              gh 运行删除 $run_id ||真实
            菲
          完成
